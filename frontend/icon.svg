<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Deja Vu1: a dock status ring around the toolhead, on a dark tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7db2ff"/>
      <stop offset="1" stop-color="#4a8df8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="44"/>
  <circle cx="256" cy="256" r="58" fill="#4a8df8"/>
  <circle cx="236" cy="236" r="16" fill="#ffffff" opacity=".55"/>
</svg>
