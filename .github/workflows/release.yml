name: Release

# Every merge to main publishes a GitHub release, so updates stay small and
# frequent. If the merge raised VERSION by hand, that number is published.
# Otherwise tools/next-release.py numbers the next patch release (0.9.0 ->
# 0.9.1), writes it into VERSION, frontend/versions.json and CHANGELOG.md, and
# commits that to main first. The app's updater reads the release: downloaded
# copies install the deja-vu1-update.zip attached here, checked against
# GitHub's SHA-256 digest. A push made with this workflow's token starts no
# other workflow, so the release commit cannot loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main with its tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION is $version, not a stable number: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "main is already released as $(git tag --points-at HEAD | head -1)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            released="$version"
            version="$(python tools/next-release.py "v$released")"
            echo "VERSION was still $released, already released: numbering this release $version."
            git add VERSION frontend/versions.json CHANGELOG.md
            git commit -m "Release $version"
            for attempt in 1 2 3; do
              git pull --rebase --quiet origin main && git push origin HEAD:main && break
              sleep $((attempt * 5))
            done
            git fetch --quiet origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Run test suite
        if: steps.version.outputs.publish == 'true'
        run: python -m unittest discover tests

      - name: Build the update package and notes
        if: steps.version.outputs.publish == 'true'
        run: |
          python tools/package-update.py "$RUNNER_TEMP/deja-vu1-update.zip"
          python tools/release-notes.py "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" "$RUNNER_TEMP/deja-vu1-update.zip" \
            --title "Deja Vu1 $version" --notes-file "$RUNNER_TEMP/notes.md" \
            --target "${{ steps.version.outputs.sha }}" --latest
