name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # Pinned rather than ubuntu-latest: GitHub's Python 3.8 builds stop at
    # Ubuntu 24.04, so a newer "latest" would break the oldest entry.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile backend and tests
        run: python -m compileall -q backend tests

      - name: Run test suite
        run: python -m unittest discover tests
