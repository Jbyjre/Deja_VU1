<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Deja Vu1 feature card</title><style>
@font-face{font-family:Display;src:url('../../frontend/fonts/BricolageGrotesque-var.woff2');font-weight:200 800}
@font-face{font-family:Sans;src:url('../../frontend/fonts/InstrumentSans-var.woff2');font-weight:400 700}
*{box-sizing:border-box;margin:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:Sans,sans-serif;background:#edf1f5;color:#192332;padding:64px;display:flex;flex-direction:column;gap:24px}
header{display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:650}.brand{display:flex;align-items:center;gap:12px}.ring{width:30px;height:30px;border:3px solid #3979dc;border-radius:50%;display:grid;place-items:center}.ring:after{content:'';width:10px;height:10px;background:#3979dc;border-radius:50%}.tag{font-size:20px;color:#46566b}
.content{display:flex;flex:1;min-height:0;flex-direction:column;gap:24px}.copy{flex-shrink:0}.eyebrow{font-size:21px;font-weight:600;color:#365a83;margin:16px 0}h1{font:700 76px/1.02 Display;letter-spacing:-2.8px;max-width:950px}p{font-size:29px;line-height:1.4;max-width:900px;color:#3d4c60;margin-top:20px}.visual{flex:1;min-height:0;background:#f8fafc;border:1px solid #d4dde8;border-radius:16px;padding:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual img{max-width:100%;max-height:100%;object-fit:contain;display:block}.evidence{font-size:21px;font-weight:600;color:#34455b}.limit{font-size:20px;margin-top:7px;color:#46566b}footer{border-top:1px solid #cbd5e1;padding-top:20px;display:flex;justify-content:space-between;gap:20px;font-size:21px;color:#34455b}footer b{color:#214f91}
@media(min-aspect-ratio:4/3){body{padding:52px 64px;gap:26px}.content{flex-direction:row;align-items:stretch;gap:44px}.copy{width:450px;display:flex;flex-direction:column;justify-content:center}h1{font-size:68px}.eyebrow{font-size:20px}p{font-size:27px}.visual{margin:20px 0}.evidence{font-size:20px}.limit{font-size:19px}}
@media(max-aspect-ratio:4/5){h1{font-size:82px}p{font-size:31px}.visual{margin:14px 0}.evidence{font-size:23px}.limit{font-size:22px}}
h1{text-wrap:balance}
</style></head><body><header><span class="brand"><i class="ring"></i>Deja Vu1</span><span class="tag">Free · open source</span></header><div class="content"><div class="copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="body"></p></div><div class="visual"><img id="image" alt=""></div></div><div><div class="evidence" id="evidence"></div><div class="limit" id="limit"></div></div><footer><b id="cta"></b><span>github.com/Jbyjre/Deja_VU1</span></footer><script>
(async()=>{const cards=await(await fetch('campaign.json')).json(),id=new URLSearchParams(location.search).get('id'),card=cards.find(c=>c.id===id);if(!card)throw new Error('Unknown card');for(const key of ['eyebrow','title','body','evidence','limit','cta'])document.getElementById(key).textContent=card[key];const img=document.getElementById('image');img.src=card.image;img.alt=card.alt;await img.decode();await document.fonts.ready;window.cardReady=true;})();
</script></body></html>
