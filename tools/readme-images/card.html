<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("../../frontend/fonts/BricolageGrotesque-var.woff2") format("woff2");font-weight:200 800}
@font-face{font-family:"Instrument Sans";src:url("../../frontend/fonts/InstrumentSans-var.woff2") format("woff2");font-weight:400 700}
@font-face{font-family:"IBM Plex Mono";src:url("../../frontend/fonts/IBMPlexMono-500.woff2") format("woff2");font-weight:500}
:root{--bg:oklch(95.4% .004 250);--text:oklch(22% .014 265);--dim:oklch(37% .014 265);--faint:oklch(49% .012 265);--ink:oklch(30% .03 265 / .075);--accent:#4a8df8;--t0:oklch(68% .17 48);--t2:oklch(64% .17 257)}
*{box-sizing:border-box;margin:0}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--bg)}
body{position:relative;font-family:"Instrument Sans",sans-serif;color:var(--text)}
.glow{position:absolute;inset:0;background:
 radial-gradient(60% 70% at 8% 0%,color-mix(in oklch,var(--t0) 34%,transparent),transparent 70%),
 radial-gradient(55% 80% at 100% 100%,color-mix(in oklch,var(--t2) 30%,transparent),transparent 70%)}
.lines{position:absolute;inset:0;background:repeating-linear-gradient(180deg,var(--ink) 0 1px,transparent 1px 5px)}
.copy{position:absolute;left:64px;top:58px;width:560px;display:flex;flex-direction:column;gap:22px}
.mark{display:flex;align-items:center;gap:14px;font:600 26px/1 "Bricolage Grotesque";letter-spacing:-.01em}
.ring{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--accent);display:grid;place-items:center;background:oklch(99% .002 250 / .7)}
.ring i{width:15px;height:15px;border-radius:50%;background:var(--accent)}
.kicker{font:500 15px/1 "IBM Plex Mono";letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h1{font:700 76px/.98 "Bricolage Grotesque";letter-spacing:-.035em;font-variation-settings:"opsz" 96}
p{font-size:25px;line-height:1.35;color:var(--dim);max-width:520px}
.foot{position:absolute;left:64px;bottom:44px;display:flex;flex-direction:column;gap:8px;font:500 14px/1.3 "IBM Plex Mono";color:var(--faint);letter-spacing:.02em}
.foot b{color:var(--text);font-weight:500}
.shot{position:absolute;left:700px;top:34px;width:318px;border-radius:22px;overflow:hidden;
 box-shadow:0 2px 4px oklch(25% .02 265 / .08),0 28px 60px oklch(25% .02 265 / .18);transform:rotate(-2deg);border:1px solid oklch(100% 0 0 / .8)}
.shot img{display:block;width:100%}
.shot2{position:absolute;left:640px;top:362px;width:520px;border-radius:18px;overflow:hidden;
 box-shadow:0 2px 4px oklch(25% .02 265 / .1),0 22px 48px oklch(25% .02 265 / .2);transform:rotate(1.4deg);border:1px solid oklch(100% 0 0 / .8)}
.shot2 img{display:block;width:100%}
.tag{position:absolute;right:56px;bottom:40px;font:500 13px/1 "IBM Plex Mono";letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;border-radius:999px;background:oklch(97% .05 95);color:oklch(42% .1 80);border:1px solid oklch(85% .09 90)}
</style></head>
<body>
<div class="glow"></div><div class="lines"></div>
<div class="copy">
  <div class="mark"><span class="ring"><i></i></span>Deja Vu1</div>
  <div class="kicker">Free · open source · for the Snapmaker U1</div>
  <h1>One screen for every U1 you run.</h1>
  <p>Watch every printer live. Start prints from your phone behind a check the server enforces. Get a message when one jams.</p>
</div>
<div class="shot"><img src="img/twin.jpg" alt=""></div>
<div class="shot2"><img src="img/fleet-cards.jpg" alt=""></div>
<div class="foot"><b>github.com/Jbyjre/Deja_VU1</b><span>MIT licence · runs on Python, nothing else</span></div>
<div class="tag">Simulated farm</div>
<script>
const q=new URLSearchParams(location.search);document.documentElement.style.setProperty('--w',(q.get('w')||1280)+'px');document.documentElement.style.setProperty('--h',(q.get('h')||640)+'px');
</script>
</body></html>
